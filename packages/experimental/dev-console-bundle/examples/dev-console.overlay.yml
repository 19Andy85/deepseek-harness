# Loader overlay for a source Web profile (`dsh --profile web --patch ...`):
# mount the project console rows without installing the bundle.
- insert:
    - id: api-session-tasks
      name: '@deepseek-ai/dsh-experimental-api-session-tasks'
    - id: client-ui-dev-console
      name: '@deepseek-ai/dsh-experimental-client-ui-dev-console'
    - id: tool-session-tasks
      name: '@deepseek-ai/dsh-experimental-tool-session-tasks'
